<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Virtual WAN inter-hub spoke firewall custom routing</title>
  <desc id="description">Two Virtual WAN hubs connect direct spokes, a Bastion VNet, two dedicated Azure Firewall VNets, and a dual-connected branch. Protected spokes peer to their local firewall VNets and use default routes to Azure Firewall.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5b00d6"/>
    </marker>
    <symbol id="vnet-icon" viewBox="0 0 32 24">
      <path d="M2 12 9 5l7 7-7 7Z" fill="none" stroke="#19bfee" stroke-width="2"/>
      <path d="m16 12 7-7 7 7-7 7Z" fill="none" stroke="#19bfee" stroke-width="2"/>
      <circle cx="13" cy="12" r="2.2" fill="#80d441"/>
      <circle cx="19" cy="12" r="2.2" fill="#80d441"/>
    </symbol>
    <symbol id="vm-icon" viewBox="0 0 32 32">
      <circle cx="16" cy="7" r="5" fill="#00a4ef"/>
      <path d="M8 28v-9c0-5 3-8 8-8s8 3 8 8v9Z" fill="#28c4ef"/>
      <path d="M5 3h5M7.5.5v5M22 3h5M24.5.5v5" stroke="#0078d4" stroke-width="2"/>
    </symbol>
    <symbol id="firewall-icon" viewBox="0 0 58 50">
      <g fill="#e54b4b" stroke="#fff" stroke-width="1">
        <rect x="5" y="4" width="15" height="10"/><rect x="21" y="4" width="15" height="10"/><rect x="37" y="4" width="15" height="10"/>
        <rect x="1" y="15" width="15" height="10"/><rect x="17" y="15" width="15" height="10"/><rect x="33" y="15" width="15" height="10"/>
        <rect x="5" y="26" width="15" height="10"/><rect x="21" y="26" width="15" height="10"/><rect x="37" y="26" width="15" height="10"/>
      </g>
      <path d="M29 36v6M12 47h34M12 47v-4M46 47v-4" fill="none" stroke="#0078d4" stroke-width="2"/>
      <circle cx="12" cy="43" r="3" fill="#50e6ff"/><circle cx="29" cy="43" r="3" fill="#50e6ff"/><circle cx="46" cy="43" r="3" fill="#50e6ff"/>
    </symbol>
    <symbol id="hub-icon" viewBox="0 0 120 110">
      <path d="M31 59c-14 0-25-10-25-23 0-11 8-20 19-22C30 4 40 0 51 4c8-5 19-4 27 2 8 6 11 14 10 23 13 1 23 11 23 24 0 14-12 25-27 25H31Z" fill="#2dc5e8"/>
      <circle cx="62" cy="70" r="28" fill="#fff" stroke="#0078d4" stroke-width="5"/>
      <path d="M34 70h56M62 42c-10 9-14 18-14 28s4 19 14 28M62 42c10 9 14 18 14 28s-4 19-14 28M38 56h48M38 84h48" fill="none" stroke="#0078d4" stroke-width="3"/>
      <path d="M15 55c9 4 14 9 16 18M103 51c-9 5-14 10-16 19" fill="none" stroke="#8064a2" stroke-width="5"/>
    </symbol>
    <style>
      text { font-family: Calibri, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .box { stroke-width: 1.5; stroke-dasharray: 5 4; }
      .spoke { fill: #dbe9fb; stroke: #5b9bd5; }
      .firewall { fill: #f7cccc; stroke: #e26b6b; }
      .branch { fill: #f2f2f2; stroke: #666; }
      .name { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 16px; text-anchor: middle; }
      .vm { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .note { font-size: 16px; }
      .route { font-size: 17px; fill: #5b00d6; }
      .connection { fill: none; stroke: #333; stroke-width: 2; }
      .peering { fill: none; stroke: #333; stroke-width: 2; }
      .static { fill: none; stroke: #5b00d6; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .vpn { fill: none; stroke: #ff7900; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <!-- Protected spokes use local firewall VNets as their only transit path. -->
  <use href="#vm-icon" x="275" y="8" width="32" height="32"/>
  <text x="315" y="24" class="note">UDR - 0.0.0.0/0</text>
  <text x="315" y="44" class="note">Next hop NVA 172.16.10.4</text>
  <rect x="230" y="64" width="250" height="126" class="box spoke"/>
  <use href="#vnet-icon" x="442" y="70" width="28" height="21"/>
  <text x="355" y="104" class="name">Hub1-Spoke1</text>
  <text x="355" y="128" class="detail">172.16.1.0/24</text>
  <text x="355" y="163" class="vm">VM 172.16.1.4</text>

  <use href="#vm-icon" x="1235" y="8" width="32" height="32"/>
  <text x="1275" y="24" class="note">UDR - 0.0.0.0/0</text>
  <text x="1275" y="44" class="note">Next hop NVA 172.16.20.4</text>
  <rect x="1120" y="64" width="250" height="126" class="box spoke"/>
  <use href="#vnet-icon" x="1332" y="70" width="28" height="21"/>
  <text x="1245" y="104" class="name">Hub2-Spoke1</text>
  <text x="1245" y="128" class="detail">172.16.3.0/24</text>
  <text x="1245" y="163" class="vm">VM 172.16.3.4</text>

  <!-- Direct spokes and dedicated firewall transit VNets. -->
  <rect x="55" y="268" width="250" height="126" class="box spoke"/>
  <use href="#vnet-icon" x="267" y="274" width="28" height="21"/>
  <text x="180" y="308" class="name">Hub1-Spoke2</text>
  <text x="180" y="332" class="detail">172.16.2.0/24</text>
  <text x="180" y="367" class="vm">VM 172.16.2.4</text>

  <rect x="355" y="268" width="250" height="126" class="box firewall"/>
  <use href="#vnet-icon" x="567" y="274" width="28" height="21"/>
  <use href="#firewall-icon" x="451" y="324" width="58" height="50"/>
  <text x="480" y="304" class="name">Firewall VNet 1</text>
  <text x="480" y="323" class="detail">172.16.10.0/24</text>
  <text x="480" y="386" class="detail">NVA 172.16.10.4</text>

  <rect x="995" y="268" width="250" height="126" class="box firewall"/>
  <use href="#vnet-icon" x="1207" y="274" width="28" height="21"/>
  <use href="#firewall-icon" x="1091" y="324" width="58" height="50"/>
  <text x="1120" y="304" class="name">Firewall VNet 2</text>
  <text x="1120" y="323" class="detail">172.16.20.0/24</text>
  <text x="1120" y="386" class="detail">NVA 172.16.20.4</text>

  <rect x="1295" y="268" width="250" height="126" class="box spoke"/>
  <use href="#vnet-icon" x="1507" y="274" width="28" height="21"/>
  <text x="1420" y="308" class="name">Hub2-Spoke2</text>
  <text x="1420" y="332" class="detail">172.16.4.0/24</text>
  <text x="1420" y="367" class="vm">VM 172.16.4.4</text>

  <path d="M355 268 355 190" class="peering"/>
  <text x="365" y="228" class="note">VNet peering</text>
  <path d="M1245 190 1120 268" class="peering"/>
  <text x="1132" y="228" class="note">VNet peering</text>

  <!-- Virtual WAN hubs and routing annotations. -->
  <use href="#hub-icon" x="440" y="470" width="120" height="110"/>
  <text x="500" y="604" class="name">Hub1</text>
  <text x="500" y="628" class="detail">192.168.0.0/22</text>

  <use href="#hub-icon" x="1040" y="470" width="120" height="110"/>
  <text x="1100" y="604" class="name">Hub2</text>
  <text x="1100" y="628" class="detail">192.168.4.0/22</text>

  <path d="M180 394 442 522" class="connection"/>
  <text x="264" y="448" class="note" transform="rotate(26 264 448)">hub1-spoke2-conn</text>
  <path d="M480 394 480 472" class="static"/>
  <text x="500" y="414" class="route" font-size="15">hub1-firewall-conn</text>
  <text x="500" y="436" class="route" font-size="15">Protected: 172.16.1.0/24</text>
  <text x="500" y="458" class="route" font-size="15">Default: 0/0 -&gt; 172.16.10.4</text>

  <path d="M1120 394 1120 472" class="static"/>
  <text x="850" y="414" class="route" font-size="15">hub2-firewall-conn</text>
  <text x="850" y="436" class="route" font-size="15">Protected: 172.16.3.0/24</text>
  <text x="850" y="458" class="route" font-size="15">Default: 0/0 -&gt; 172.16.20.4</text>
  <path d="M1420 394 1158 522" class="connection"/>
  <text x="1335" y="448" class="note" transform="rotate(-26 1335 448)">hub2-spoke2-conn</text>

  <path d="M560 532H1040" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="800" y="557" class="note" text-anchor="middle">Virtual WAN inter-hub transit</text>

  <text x="18" y="514" class="route">Custom vHub routes in both hubs:</text>
  <text x="18" y="538" class="route">172.16.1.0/24 -&gt; hub1-firewall-conn</text>
  <text x="18" y="562" class="route">172.16.3.0/24 -&gt; hub2-firewall-conn</text>
  <text x="18" y="586" class="route">No Routing Intent</text>
  <path d="M340 545H429" class="static"/>

  <!-- Bastion and dual-connected branch. -->
  <rect x="65" y="650" width="250" height="120" class="box spoke"/>
  <use href="#vnet-icon" x="277" y="656" width="28" height="21"/>
  <text x="190" y="692" class="name">Bastion VNet</text>
  <text x="190" y="716" class="detail">10.200.0.0/24</text>
  <text x="190" y="748" class="detail">privateOnlyRouteTable</text>
  <path d="M315 684 461 575" class="connection"/>

  <rect x="650" y="716" width="300" height="140" class="box branch"/>
  <use href="#vm-icon" x="784" y="728" width="32" height="32"/>
  <text x="800" y="783" class="name">Branch / On-premises</text>
  <text x="800" y="807" class="detail">10.100.0.0/16</text>
  <text x="800" y="837" class="vm">VM 10.100.0.4</text>
  <path d="M500 630V670L710 716" class="vpn"/>
  <path d="M1100 630V670L890 716" class="vpn"/>
  <text x="520" y="676" fill="#ff7900" font-size="18">IPsec + BGP</text>
  <text x="980" y="676" fill="#ff7900" font-size="18">IPsec + BGP</text>

  <text x="1270" y="522" class="route" font-size="15">internetOnlyRouteTable:</text>
  <text x="1270" y="546" class="route" font-size="15">0.0.0.0/0 -&gt; local firewall connection</text>
  <text x="1270" y="570" class="route" font-size="15">Protected prefixes -&gt; owning firewall</text>
  <path d="M1254 543H1168" class="static"/>
</svg>
